apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-news
  labels:
    app: kube-news
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-news
  template:
    metadata:
      labels:
        app: kube-news
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: kube-news
          image: <account_id>.dkr.ecr.<region>.amazonaws.com/kube-news:v1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kube-news-config
            - secretRef:
                name: kube-news-db
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
